[package]
name = "qnc"
version = "0.1.0"
edition = "2024"
description = "netcat-like QUIC client/server"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
quinn = { version = "0.11", features = ["qlog"] }
rcgen = "0.13"
serde_json = { version = "1", features = ["preserve_order"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std", "tracing-log"] }
rustyline = "17"
libc = "0.2"
socket2 = "0.6"
rustls-native-certs = "0.8"
qpack = { version = "0.1.0", default-features = false }
